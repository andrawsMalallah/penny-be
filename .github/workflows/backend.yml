name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: penny
          POSTGRES_USER: postgres
          # Disposable CI-only credentials; never use deployed database credentials.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d penny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PENNY_DB_HOST: localhost
      PENNY_DB_PORT: '5432'
      PENNY_DB_NAME: penny
      PENNY_DB_USER: postgres
      PENNY_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
      PENNY_DB_SSLMODE: disable
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Generate disposable application keys
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from django.core.management.utils import get_random_secret_key
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(f'PENNY_SECRET_KEY={get_random_secret_key()}\n')
              output.write(f'PENNY_MFA_ENCRYPTION_KEY={Fernet.generate_key().decode()}\n')
          PY
      - name: Lint and formatting
        run: |
          python -m ruff check . --no-cache
          python -m ruff format --check . --no-cache
      - name: Django configuration and migration drift
        run: |
          python manage.py check --settings=config.settings.unit
          python manage.py makemigrations --check --dry-run --settings=config.settings.unit
      - name: Full PostgreSQL regression suite
        run: python manage.py test --settings=config.settings.test --verbosity=1 --noinput
      - name: Compile application modules
        run: python -m compileall -q apps config scripts tests
      - name: Validate Linux WSGI runtime and HTTP liveness
        env:
          # PostgreSQL behavior is covered above; this check deliberately uses a dummy DB.
          DJANGO_SETTINGS_MODULE: config.settings.unit
        run: |
          python -m gunicorn --check-config --config config/gunicorn.py config.wsgi:application
          python -m gunicorn --config config/gunicorn.py --bind 127.0.0.1:8001 config.wsgi:application &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health/', timeout=2) as response:
                      assert response.status == 200
                      assert json.load(response) == {'status': 'ok'}
                  break
              except urllib.error.URLError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Gunicorn did not become healthy.')
          PY
